services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: crawler_system_app
    ports:
      - "8000:8000"
    environment:
      CRAWLER_BOOTSTRAP_ADMIN_USERNAME: ${CRAWLER_BOOTSTRAP_ADMIN_USERNAME:-}
      CRAWLER_BOOTSTRAP_ADMIN_PASSWORD: ${CRAWLER_BOOTSTRAP_ADMIN_PASSWORD:-}
      CRAWLER_CORS_ALLOWED_ORIGINS: ${CRAWLER_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8093,http://localhost:8093}
      CRAWLER_CORS_ALLOWED_ORIGIN_REGEX: ${CRAWLER_CORS_ALLOWED_ORIGIN_REGEX:-}
      CRAWLER_OUTBOUND_PROXY_URL: ${CRAWLER_OUTBOUND_PROXY_URL:-}
      CRAWLER_USE_SYSTEM_PROXY: ${CRAWLER_USE_SYSTEM_PROXY:-true}
      CRAWLER_OUTBOUND_NO_PROXY: ${CRAWLER_OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,service.most.gov.cn,gdstc.gd.gov.cn,kjj.gz.gov.cn,www.hp.gov.cn,www.hengqin.gov.cn,kjt.hunan.gov.cn,kjj.changsha.gov.cn}
    volumes:
      - ./server/storage:/app/server/storage
      - ./server/data.db:/app/server/data.db
